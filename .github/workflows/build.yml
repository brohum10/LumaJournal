name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Validate property lists
        run: plutil -lint LumaJournal/Info.plist LumaJournal/PrivacyInfo.xcprivacy
      - name: Build and test
        run: xcodebuild test -project LumaJournal.xcodeproj -scheme LumaJournal -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-test-results
          path: TestResults.xcresult
